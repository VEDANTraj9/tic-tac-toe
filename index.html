<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="turn">
        <div class="choose">
            <div class="turn1 b-s">
X
            </div>
            <div class="turn2">
O
            </div>
        </div>
        </div>
        <div class="game">









            <button class="boxes box1 hover" title="Box 1"></button>
            <button class="boxes box2 hover" title="Box 2"></button>
            <button class="boxes box3 hover" title="Box 3"></button>
            <button class="boxes box4 hover" title="Box 4"></button>
            <button class="boxes box5 hover" title="Box 5"></button>
            <button class="boxes box6 hover" title="Box 6"></button>
            <button class="boxes box7 hover" title="Box 7"></button>
            <button class="boxes box8 hover" title="Box 8"></button>
            <button class="boxes box9 hover" title="Box 9"></button>
        </div>


        <div class="msg hide">
            Winner <span id="result"></span>
        </div>

        
        <button class="btn" id="reset">Reset</button>
            <button class="btn" id="ng">New Game</button>
    </div>
<script src="script.js"></script>  
</body>
</html>
